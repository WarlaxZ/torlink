<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Same as the dashboard: the URL carries a stream capability in ?k=, and
         a Referer would hand it to whatever a link on this page points at. -->
    <meta name="referrer" content="no-referrer" />
    <title>torlnk</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header>
      <h1 aria-label="torlnk">
        <svg class="wordmark-icon" viewBox="0 0 24 24" width="30" height="30" aria-hidden="true" focusable="false">
          <path class="magnet-body" d="M7.6 3 V12.5 A4.4 4.4 0 0 0 16.4 12.5 V3" />
          <rect class="magnet-tip magnet-tip-a" x="5.6" y="0.5" width="4" height="4.5" rx="0.8" />
          <rect class="magnet-tip magnet-tip-b" x="14.4" y="0.5" width="4" height="4.5" rx="0.8" />
        </svg>
        <span class="wordmark-text">torlnk</span>
      </h1>
      <!--
        The href is the FALLBACK, not the behaviour. player.js intercepts the
        click and goes back one history entry when there is a same-origin one to
        go back to, which lands on the search that got you here — the dashboard
        keeps its query in its own URL for exactly this. The href covers the
        cases where there is no such entry: a player URL that was bookmarked, or
        opened in a new tab, or pasted onto a phone.

        It used to say "back to queue" and land on the search pane, which was
        simply untrue.
      -->
      <a id="back" class="back" href="/">← back to results</a>
    </header>

    <!-- Everything below is filled in by player.js from the page's own URL.
         Nothing is templated server-side: this file ships as static bytes.

         Inside <main>, which it was not: the breadcrumb, the filename, the video
         and every control sat outside any landmark, so "skip to main content"
         had nothing to skip to and a screen reader's landmark list showed only
         the header. The dashboard already has one. -->
    <main>
      <p id="breadcrumb" class="breadcrumb" hidden></p>
      <p id="file-name" class="file-name"></p>
      <div id="stage" class="stage"></div>
      <div id="actions" class="actions"></div>
      <!-- Casting: a hand-off like the buttons above, so it sits beside them.
           Its own container rather than a child of #actions because that row is
           rebuilt per file with replaceChildren, which would drop a live cast's
           controls the moment anything else re-rendered. Empty (and so invisible)
           until the device list answers — see castButtonView's "hidden". -->
      <div id="cast" class="actions cast"></div>
      <p id="notice" class="notice" hidden></p>
      <!-- The rest of the torrent: what is up next, and everything else in it.
           Empty for a single-file session, so a film looks exactly as it did. -->
      <div id="episodes" class="episodes" hidden></div>
    </main>

    <script type="module" src="/player.js"></script>
  </body>
</html>
